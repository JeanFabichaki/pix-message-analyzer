services:
  postgres:
    image: postgres:16-alpine
    container_name: pix-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pix_guard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: user-service
    ports:
      - "8002:8002"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pix_guard_db
    volumes:
      - ./services/user-service/src:/app/services/user-service/src
      - ./libs/common:/app/libs/common
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy

  gemini-investigation-agent:
    build:
      context: .
      dockerfile: agents/gemini-investigation-agent/Dockerfile
    container_name: gemini-investigation-agent
    ports:
      - "8003:8003"
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pix_guard_db
      - USER_SERVICE_URL=http://user-service:8002
    volumes:
      - ./agents/gemini-investigation-agent/src:/app/agents/gemini-investigation-agent/src
      - ./libs/common:/app/libs/common
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  ollaya:
    image: ghcr.io/ollaya-dev/ollaya:latest
    container_name: pix-ollaya
    environment:
      # Descarrega o modelo base após 5 min ocioso para economizar RAM quando o benchmark não estiver ativo
      - OLLAYA_KEEP_ALIVE=5m
      - OLLAYA_MAX_LOADED_MODELS=1
      # Ajuste de threads no CPU para evitar context switching e estabilizar p95/p99
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - OLLAYA_MAX_QUEUE=64
    ports:
      - "11435:11435"
    volumes:
      - ollaya_models:/home/ollaya/.ollaya
    restart: unless-stopped

  ollaya-tuned-1:
    image: ghcr.io/ollaya-dev/ollaya:latest
    container_name: pix-ollaya-tuned-1
    environment:
      # Mantém o modelo retreinado sempre residente em RAM para inferência ultrarrápida (<35ms)
      - OLLAYA_KEEP_ALIVE=-1
      - OLLAYA_MAX_LOADED_MODELS=1
      # Ajuste de threads no CPU para evitar context switching e estabilizar p95/p99
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - OLLAYA_MAX_QUEUE=64
    ports:
      - "11436:11435"
    volumes:
      - ollaya_models:/home/ollaya/.ollaya
    restart: unless-stopped

  ollaya-tuned-2:
    image: ghcr.io/ollaya-dev/ollaya:latest
    container_name: pix-ollaya-tuned-2
    environment:
      - OLLAYA_KEEP_ALIVE=-1
      - OLLAYA_MAX_LOADED_MODELS=1
      # Ajuste de threads no CPU para evitar context switching e estabilizar p95/p99
      - OMP_NUM_THREADS=4
      - OPENBLAS_NUM_THREADS=4
      - OLLAYA_MAX_QUEUE=64
    ports:
      - "11437:11435"
    volumes:
      - ollaya_models:/home/ollaya/.ollaya
    restart: unless-stopped

  pix-gateway-service:
    build:
      context: .
      dockerfile: services/pix-gateway-service/Dockerfile
    container_name: pix-gateway-service
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      - USER_SERVICE_URL=http://user-service:8002
      - GEMINI_AGENT_URL=http://gemini-investigation-agent:8003
      - OLLAYA_BASE_URL=http://ollaya:11435
      - OLLAYA_CLUSTER_URLS=http://ollaya:11435
      - LAYA_TUNED_BASE_URL=http://ollaya-tuned-1:11435
      - LAYA_TUNED_CLUSTER_URLS=http://ollaya-tuned-1:11435,http://ollaya-tuned-2:11435
      - LAYA_TUNED_MODEL=laya:pix-threats
      - OLLAYA_TIMEOUT_SECONDS=25.0

    volumes:
      - ./services/pix-gateway-service/src:/app/services/pix-gateway-service/src
      - ./finetune/data:/data:ro
      - ./libs/common:/app/libs/common
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
    depends_on:
      - user-service
      - gemini-investigation-agent
      - ollaya
      - ollaya-tuned-1
      - ollaya-tuned-2

  frontend-service:
    build:
      context: ./services/frontend-service
      dockerfile: Dockerfile
    container_name: pix-frontend
    ports:
      - "3000:3000"
    environment:
      - BACKEND_GATEWAY_URL=http://pix-gateway-service:8001
      - BACKEND_USER_SERVICE_URL=http://user-service:8002
      - BACKEND_GEMINI_AGENT_URL=http://gemini-investigation-agent:8003
    volumes:
      - ./services/frontend-service:/app
      - /app/node_modules
    depends_on:
      - pix-gateway-service

volumes:
  pgdata:
  ollaya_models:
