steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/pix-guard-poc/pix-guard-repo/pix-gateway-service:latest'
      - '-f'
      - 'services/pix-gateway-service/Dockerfile'
      - '.'

images:
  - 'us-central1-docker.pkg.dev/pix-guard-poc/pix-guard-repo/pix-gateway-service:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '300s'
